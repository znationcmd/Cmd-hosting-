name: CMD Hosting responsive visual checks
on:
  push:
    branches: ["visual/hosting-premium-complete-20261017"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check responsive layout and preserved controls
        run: |
          python3 -m http.server 8765 --directory web/public > /tmp/hosting-preview.log 2>&1 &
          node tests/hosting-responsive.cjs
          node tests/hosting-uhd.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosting-responsive-review
          path: visual-results/
          retention-days: 7
