name: CMD Hosting - UI and migration safety checks

on:
  workflow_dispatch:
  push:
    paths:
      - "ui/**"
      - "web/**"
      - "tests/premium-ui.test.mjs"
      - "tests/restored-web.test.mjs"
      - "services/mods-api/index.ts"
      - "tests/mobile-catalog-profiles.test.mjs"
      - "tests/fs25-unified-hosting-nav.test.mjs"
      - "tests/fs25-modhub-search-v8.test.mjs"
      - "tests/palworld-mobile-navigation.test.mjs"
      - "tests/cmd-unified-mobile-v6.test.mjs"
      - "tests/cmd-simplified-mobile-v7.test.mjs"
      - "tests/cmd-server-first-v8.test.mjs"
      - "tests/cmd-server-first-v9.test.mjs"
      - "tests/anomalia-nasdara-catalog.test.mjs"
      - "scripts/recover-hosting-public.mjs"
      - ".github/workflows/cmd-hosting-ui-checks.yml"
  pull_request:
    paths:
      - "ui/**"
      - "web/**"
      - "tests/premium-ui.test.mjs"
      - "tests/restored-web.test.mjs"
      - "services/mods-api/index.ts"
      - "tests/mobile-catalog-profiles.test.mjs"
      - "tests/fs25-unified-hosting-nav.test.mjs"
      - "tests/fs25-modhub-search-v8.test.mjs"
      - "tests/palworld-mobile-navigation.test.mjs"
      - "tests/cmd-unified-mobile-v6.test.mjs"
      - "tests/cmd-simplified-mobile-v7.test.mjs"
      - "tests/cmd-server-first-v8.test.mjs"
      - "tests/cmd-server-first-v9.test.mjs"
      - "tests/anomalia-nasdara-catalog.test.mjs"
      - "scripts/recover-hosting-public.mjs"
      - ".github/workflows/cmd-hosting-ui-checks.yml"

permissions:
  contents: read

jobs:
  safe-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate HTML/CSS/SVG UI additions without deploying
        run: node --test tests/premium-ui.test.mjs tests/restored-web.test.mjs tests/anomalia-nasdara-catalog.test.mjs tests/mobile-catalog-profiles.test.mjs tests/fs25-unified-hosting-nav.test.mjs tests/fs25-modhub-search-v8.test.mjs tests/palworld-mobile-navigation.test.mjs tests/cmd-unified-mobile-v6.test.mjs tests/cmd-simplified-mobile-v7.test.mjs tests/cmd-server-first-v8.test.mjs tests/cmd-server-first-v9.test.mjs tests/anomalia-workshop-bridge.test.mjs tests/anomalia-catalog.test.mjs
      - name: Parse mobile catalogue, workshop and navigation scripts
        run: |
          node --check web/public/mod-v2-ui.js
          node --check web/public/mod-auto-detect.js
          node --check web/public/catalog-compat.js
          node --check web/public/ui/cmd-navigation-cleanup.js
          node --check web/public/ui/cmd-unified-experience-v6.js
          node --check web/public/ui/cmd-simplified-navigation-v7.js
          node --check web/public/ui/cmd-server-first-v8.js
          node --check web/public/ui/cmd-server-first-v9.js
      - name: Parse public-source recovery script
        run: node --check scripts/recover-hosting-public.mjs
      - name: Validate snapshot origin and route safety offline
        run: node scripts/recover-hosting-public.mjs --self-test
