name: CMD Hosting - production 3D verification
on:
  push:
    paths:
      - ".github/workflows/cmd-hosting-live-asset-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check live page and injected script without touching account data
        shell: bash
        run: |
          set -euo pipefail
          base="https://cmd-hosting-web-production.up.railway.app"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --connect-timeout 12 --max-time 40 "$base/" -o /tmp/home.html
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --connect-timeout 12 --max-time 40 "$base/mod-auto-detect.js" -o /tmp/mod.js
          echo "HTML bytes: $(wc -c < /tmp/home.html)"
          echo "JS bytes: $(wc -c < /tmp/mod.js)"
          grep -q "mod-auto-detect.js" /tmp/home.html
          grep -q "cmd-hosting-blue-violet-live" /tmp/mod.js
          grep -q "hosting-3d-surface" /tmp/mod.js
          grep -q "hosting-click-lit" /tmp/mod.js
          grep -q "requestPermission" /tmp/mod.js
          grep -q "cvRefresh" /tmp/mod.js
          echo "All checks passed: website online, original module retained, blue-to-violet 3D active in served code"
