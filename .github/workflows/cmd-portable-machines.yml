name: CMD Hosting - Portable machine compatibility
on:
  workflow_dispatch:
  push:
    paths:
      - "provisioning/host-capability.mjs"
      - "provisioning/host-capability.test.mjs"
      - "provisioning/portable-host-agent.mjs"
      - "provisioning/machine-fleet.mjs"
      - "provisioning/machine-fleet.test.mjs"
      - "provisioning/provider-adapters.mjs"
      - "provisioning/game-content.mjs"
      - "provisioning/game-content.test.mjs"
      - "scripts/Configure-CMDGameContent.ps1"
      - "scripts/CMDHostingRentalWorker.ps1"
      - "scripts/CMDHostingRentalWorkerV2.ps1"
      - "tests/windows-game-content.ps1"
      - ".github/workflows/cmd-portable-machines.yml"
  pull_request:
    paths:
      - "provisioning/host-capability.mjs"
      - "provisioning/host-capability.test.mjs"
      - "provisioning/portable-host-agent.mjs"
      - "provisioning/machine-fleet.mjs"
      - "provisioning/machine-fleet.test.mjs"
      - "provisioning/provider-adapters.mjs"
      - "provisioning/game-content.mjs"
      - "provisioning/game-content.test.mjs"
      - "scripts/Configure-CMDGameContent.ps1"
      - "scripts/CMDHostingRentalWorker.ps1"
      - "scripts/CMDHostingRentalWorkerV2.ps1"
      - "tests/windows-game-content.ps1"
permissions:
  contents: read
jobs:
  cross-platform:
    name: "Node 22 on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check portable agent syntax
        run: node --check provisioning/portable-host-agent.mjs
      - name: Check hardware detector syntax
        run: node --check provisioning/host-capability.mjs
      - name: Verify Supermicro and AMD fleet planner syntax
        run: node --check provisioning/machine-fleet.mjs
      - name: Run cross-platform and multi-node placement tests
        run: node --test provisioning/host-capability.test.mjs provisioning/machine-fleet.test.mjs provisioning/game-content.test.mjs
      - name: Read-only hardware diagnostic
        run: node provisioning/portable-host-agent.mjs --diagnose

      - name: Validate PowerShell content configurator syntax (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/Configure-CMDGameContent.ps1',[ref]$tokens,[ref]$errors)
          if ($errors -and $errors.Count) { $errors | Format-Table; exit 1 }
          Write-Host 'CMD Hosting content parser OK'

      - name: Validate Windows rental worker v2 PowerShell source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/CMDHostingRentalWorkerV2.ps1',[ref]$tokens,[ref]$errors)
          if ($errors -and $errors.Count) { $errors | Format-Table; exit 1 }
          Write-Host 'CMD Hosting Windows paid-rental worker V2 syntax OK'

      - name: Execute isolated Windows map and mod preparation fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-game-content.ps1
