name: CMD Hosting - Real game files manager (no Railway)
on:
  workflow_dispatch:
  push:
    paths:
      - 'local-panel/**'
      - 'asa-astraeos/**'
      - 'dayz-worlds/**'
      - 'CMD-5-SERVEURS-UN-SEUL.cmd'
      - 'DEMARRER-CMD-HOSTING-FICHIERS.cmd'
      - 'scripts/Installer-DayZ-PC-1-clic.ps1'
      - 'scripts/INSTALLER-DAYZ-PC-UN-CLIC.cmd'
      - '.github/workflows/cmd-hosting-local-files.yml'
permissions:
  contents: read
jobs:
  verify:
    name: Real-file explorer ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate actual game file explorer JavaScript
        run: |
          node --check local-panel/server.mjs
          node --check local-panel/app.js
          node --check local-panel/exclusive-game-lock.mjs
          node --check local-panel/game-profiles.mjs
          node --check dayz-worlds/manager.mjs
          node --check asa-astraeos/manager.mjs
      - name: Run real filesystem and security contract tests
        run: node --test local-panel/server.test.mjs dayz-worlds/worlds.test.mjs asa-astraeos/manager.test.mjs local-panel/exclusive-game-lock.test.mjs
      - name: Package double-click Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path distribution\local-panel | Out-Null
          Copy-Item DEMARRER-CMD-HOSTING-FICHIERS.cmd,CMD-5-SERVEURS-UN-SEUL.cmd distribution\
          Copy-Item dayz-worlds distribution\dayz-worlds -Recurse
          Copy-Item asa-astraeos distribution\asa-astraeos -Recurse
          New-Item -ItemType Directory -Force -Path distribution\scripts | Out-Null
          Copy-Item scripts/Installer-DayZ-PC-1-clic.ps1,scripts/INSTALLER-DAYZ-PC-UN-CLIC.cmd distribution\scripts\
          # Include every local runtime module (persistent-profiles and rental-policy were missing from old ZIP).
          Copy-Item local-panel/*.mjs,local-panel/*.js,local-panel/*.html,local-panel/*.css,local-panel/README.md distribution\local-panel\
          # Import the DISTRIBUTION COPY, not the source tree: fail before upload if any module is missing.
          node --input-type=module -e "import('./distribution/local-panel/server.mjs').then(() => console.log('Distributed CMD Hosting boots: all imports resolved'))"
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP would not start: missing dependency' }
      - name: Upload Windows ready-to-extract archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CMDHosting-5-Serveurs-DayZ-ARK-Windows
          path: distribution/
          retention-days: 90
          if-no-files-found: error
